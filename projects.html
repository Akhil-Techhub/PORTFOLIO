<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio | Akhil</title>
    <style>
        .projects {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.card {
  background: #decfcf;
  padding: 20px;
  border-radius: 15px;
  width: 250px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 20px #00ff9d;
}

.project-links {
  margin-top: 10px;
}

.project-links a {
  text-decoration: none;
  background: #00ff9d;
  color: black;
  padding: 5px 10px;
  border-radius: 10px;
  margin-right: 5px;
}

h2 {
  text-align: center;
}
    </style>
</head>

<body>



<!-- PROJECTS -->
<section class="section">

    <h2>My Projects  </h2>

    <div class="projects">

        <!-- PROJECT 1 -->
        <div class="card">
            <h3>Financial Fraud Detection</h3>
            <p>ML-based system with dashboard.</p>

            <div class="project-links">
                <a href="#">GitHub</a>
                <a href="#">Live Demo</a>
            </div>
        </div>

        <!-- PROJECT 2 -->
        <div class="card">
            <h3>Portfolio Website</h3>
            <p>Modern responsive portfolio design.</p>

            <div class="project-links">
                <a href="#">GitHub</a>
                <a href="#">Live Demo</a>
            </div>
        </div>

    </div>

</section>

<script id="portfoliojs">
/* Active link */
document.querySelectorAll(".nav-link").forEach(link => {
  if (link.href === window.location.href) {
    link.classList.add("active");
  }
});

/* Card hover effect (extra smooth) */
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("mouseenter", () => {
    card.style.transform = "translateY(-10px)";
  });

  card.addEventListener("mouseleave", () => {
    card.style.transform = "translateY(0)";
  });
});

/* Mobile menu */
function toggleMenu() {
  document.getElementById("nav-links").classList.toggle("show");
}
</script>
</body>
</html>
